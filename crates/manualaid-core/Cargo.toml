[package]
name = "manualaid-core"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chardetng = "1.0.0"
chrono = "0.4.45"
cloakrs-core = "0.3.0"
cloakrs-locales = "0.3.0"
dirs = "6.0.0"
log.workspace = true
named-lock = "0.4.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["process", "time", "io-util", "macros", "rt"] }
toml = "1.1.4"
toml_edit = "0.22"
which-terminal = "0.1.0"
