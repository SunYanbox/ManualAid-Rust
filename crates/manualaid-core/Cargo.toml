[package]
name = "manualaid-core"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chardetng = "1.0.0"
chrono = "0.4.45"
log.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "time", "io-util", "macros", "rt"] }
toml = "1.1.4"
which-terminal = "0.1.0"

