[tool.shell]
desc = """
执行终端命令并返回其输出。

- 具体可以使用的命令与用户当前终端有关，使用的命令语法应当遵守用户终端的格式要求。
- 工作目录在调用之间持久存在，但优先使用绝对路径——复合命令中的`cd`可能触发权限提示。shell状态（环境变量、函数）不会持久化；shell从用户配置文件初始化。
- 重要：除非明确指示或在你验证专用工具无法完成你的任务之后，否则避免使用此工具运行终端命令。相反，使用适当的专用工具，这将为用户提供更好的体验。
- `timeout`以毫秒为单位：默认120000，最大600000。
"""

[tool.shell.param.command]
desc = "要执行的命令"

[tool.shell.param.description]
desc = """
用主动语态清晰简明地描述此命令的作用。绝不要在描述中使用\"复杂\"或\"风险\"等词语——只描述它的作用。

对于简单命令（git、npm、标准CLI工具），保持简短（5-10个词）：
- ls → \"列出当前目录中的文件\"
- git status → \"显示工作树状态\"
- npm install → \"安装包依赖\"

对于一眼难以解析的命令（管道命令、晦涩标志等），添加足够的上下文来澄清其作用：
- find . -name \"*.tmp\" -exec rm {} \\; → \"查找并递归删除所有.tmp文件\"
- git reset --hard origin/main → \"丢弃所有本地更改并与远程main保持一致\"
- curl -s url | jq '.data[]' → \"从URL获取JSON并提取data数组元素\"
"""

[tool.shell.param.timeout]
desc = "可选超时时间（毫秒，最大600000）"

[tool.read]
desc = """
从本地文件系统读取文件。

- `file_path`必须是绝对路径。
- 你可以选择指定行偏移量和限制（对于长文件尤其有用），但建议不提供这些参数来读取整个文件。
- 读取目录、缺失文件或空文件会返回错误或系统提醒，而非内容。
- 不要重新读取刚刚编辑过的文件来验证——如果更改失败，Edit/Write会报错，系统会为你跟踪文件状态。
"""

[tool.read.param.file_path]
desc = "要读取的文件的绝对路径"

[tool.read.param.offset]
desc = "开始读取的行号。仅当文件太大无法一次性读取时提供"

[tool.read.param.limit]
desc = "要读取的行数。仅当文件太大无法一次性读取时提供。"

[tool.read.param.show_line_numbers]
desc = "以 cat -n 格式显示绝对 1-based 行号（右对齐数字 + `| ` 标记）。仅当需要详细行号时提供。"

[tool.read.param.show_line_endings]
desc = "以 cat -E 格式显示行尾：`$` 表示 LF，`^M$` 表示 CRLF。仅当需要确认文件行尾风格时提供。"

[tool.edit]
desc = """
在文件中执行精确字符串替换。

- 你在本次对话中必须先Read该文件，否则调用将失败。
- `old_string`必须与文件完全匹配，包括缩进，行尾，并且必须是唯一的——否则编辑失败。
- 如果 Read 输出包含行号或行尾诊断标记，匹配前请先去除这些标记。
- `replace_all: true`将替换所有出现的匹配。
"""

[tool.edit.param.file_path]
desc = "要修改的文件的绝对路径"

[tool.edit.param.old_string]
desc = "要替换的文本。"

[tool.edit.param.new_string]
desc = "要替换成的文本（必须与old_string不同）"

[tool.edit.param.replace_all]
desc = "替换所有出现的old_string（默认false）"

[tool.write]
desc = """
写入文件到本地文件系统，如果文件存在则覆盖。

何时使用：创建新文件，或完全替换你已Read过的文件。覆盖尚未Read的现有文件将失败。对于部分更改，请使用Edit。
"""

[tool.write.param.file_path]
desc = "要写入的文件的绝对路径（必须是绝对路径，非相对路径）"

[tool.write.param.content]
desc = "要写入文件的内容"

[tool.skill]
desc = """
在主对话中执行一个技能

当用户要求你执行任务时，检查是否有任何可用技能匹配。技能提供专业能力和领域知识。

当用户引用\"斜杠命令\"或\"/<某内容>\"时，他们指的是技能。使用此工具来调用它。

如何调用：将`skill`设置为可用技能的确切名称（不带前导斜杠）。

重要：
- 可用技能在对话的系统提醒消息中列出
- 仅调用该列表中出现的技能，或用户在其消息中明确输入`/<名称>`的技能。切勿从训练数据中猜测或发明技能名称；否则不要调用此工具
- 当技能匹配用户请求时，这是一个阻塞性要求：在生成关于该任务的任何其他响应之前，先调用相关的Skill工具
- 绝不要提及某个技能而不实际调用此工具
- 不要调用已在运行的技能
- 不要将此工具用于内置CLI命令（如/help、/clear等）
"""

[tool.skill.param.skill]
desc = "可用技能列表中的技能名称。不要猜测名称。"

[tool.skill.param.args]
desc = "技能的可选参数"
