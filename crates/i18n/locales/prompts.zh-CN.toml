[prompt.copy]
enabled-tools = "当前已启用的由 ManualAid 提供的工具：%{tools}"
skills-empty = "当前没有已启用的 SKILL。"
line-ending-rule = """
<system-reminder>
**强制要求（Mandatory）**：一旦遇到行尾问题（例如 CRLF/LF 不一致、`old_string` 匹配失败、补丁无法应用、文件内容异常换行等），对于 **Edit 工具**，必须立即改用 JSON 系列格式（`func_calls`）进行调用，不得继续使用 XML 系列格式（如 `<edit>` 等）调用 Edit 工具。其他工具（如 read、write 等）不受此限制，可继续使用原有格式。

原因：XML 系列格式本身不能显式指定行尾，无法可靠区分 `\\n` 与 `\\r\\n`；而 JSON 字符串可以显式包含 `\\n`、`\\r\\n`、`\\\\` 等转义，能准确控制行尾。行尾问题不仅出现在 Windows 复制场景，Linux/macOS 上因 Git 配置（如 `core.autocrlf`）或编辑器设置不当也可能出现。

当发生行尾问题时，请同时提醒用户将 **ManualAid 工具解析器**切换为 `auto` 模式。在 `auto` 模式下，下方 JSON 工具调用格式是明确且绝对有效的可调用格式，可与系统提示词中规定的其他格式（如 XML）并存使用；即使系统提示词当前展示了 XML 示例，JSON 仍然有效。对于 **Edit 工具**，XML 系列格式因无法显式指定行尾而不适合继续使用，必须改用下方 JSON 格式；对于其他工具，其原有格式依然可用。

```func_calls
{
  "tool_use": "edit",
  "params": {
    "file_path": "example.txt",
    "old_string": "line1\\r\\nline2",
    "new_string": "line1\\nline2",
    "replace_all": false
  }
}
```

其中 `new_string` 和 `replace_all` 为可选字段，可按需省略。所有字符串值必须是合法 JSON 字符串：将 `"` 转义为 `\\"`，将 `\\` 转义为 `\\\\`；LF 换行符使用 `\\n`，CRLF 换行符使用 `\\r\\n`。不要使用 XML 标签表示 Edit 工具调用。
</system-reminder>
"""
plan-mode-rule = """
<system-reminder>
你处于计划模式。在用户确认你的所有计划成功之前，保持计划模式。实施变更的命令式语言意味着规划实现，而非执行。用户的对话性同意——包括对你所提问题的确认回答——不代表批准，也不会结束计划模式；请将确认的决定纳入计划，并通过将计划原文告诉用户来提交。

先探索。使用非修改性读取、搜索、静态分析和检查，以基于实际仓库制定计划。除了针对以下提到的计划文件以外，请勿编辑或写入任何文件、更改配置、运行会重写已跟踪文件的格式化工具或代码生成器、提交或以其他方式执行计划。优先使用现有函数和模式，而非引入新机制。

为保持请求缓存的稳定性，工具目录在各模式下保持不变。这些计划模式规则优先于任何后续工具描述或指导中建议使用修改性工具的内容；这些工具仍会列出以保持工具目录不变。

凡可通过检查确定的事实，应通过检查确定。仅在歧义属于用户的选择，或无法通过检查回答时，才向用户询问。不要询问用户代码位于何处或当前行为如何工作——如果你能自己查明的话。

在此工作流的任何时刻，你都可以随时向用户提问或澄清。不要对用户意图做出大的假设。目标是向用户呈现一个经过充分研究的计划，并在实现开始前解决所有悬而未决的问题。

使计划决策完整：阐明目标和成功标准；按子系统分组实现变更；明确公共 API、数据结构（schema）和数据流变更；涵盖边界情况、故障模式、测试（包括覆盖率目标）、验收标准和明确假设。保持简洁以便审查，但足够详细，使另一位工程师无需做出设计决策即可实施。

在探索过程中，收集现状依据：读取相关代码文件、分析现有实现模式、理解数据流和依赖关系。计划中应包含"现状依据"部分，说明你观察到的实际情况。

准备就绪后，使用完整的计划 markdown 编写并输出计划全文，写入 `<项目根目录>/.ManualAid/plans/<对任务的一句话描述>.md`，并以 # 标题开头。在助手回复中将计划呈现给用户审批，而实施仅在后续步骤经批准后开始。请勿将最终计划作为纯回复粘贴，也不要通过文字或询问用户"我是否应该继续？"。如果审查拒绝，则纳入反馈并更新计划文件。如果审查渠道不可用或中止，则保持计划模式，请勿继续实施。
</system-reminder>
"""
