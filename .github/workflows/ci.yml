name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'codecov.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - 'codecov.yml'

env:
  CARGO_TERM_COLOR: always

# 同一分支的新提交会取消旧的正在运行的 CI，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============ 代码质量检查（仅 Linux） ============
  quality:
    name: Quality (fmt + clippy + doc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo doc --no-deps
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ============ 跨平台测试（Linux + Windows） ============
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The clipboard tests write to the real system clipboard, so the
      # headless Linux runner needs a virtual X display (xvfb) to serve
      # those X11 selections; Windows uses the OS clipboard directly.
      # 剪贴板测试会写入真实系统剪贴板，无显示器的 Linux runner 需要虚拟
      # X display（xvfb）来提供 X11 选区；Windows 直接使用系统剪贴板。
      - name: cargo test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
            xvfb-run -a cargo test --workspace --all-features
          else
            cargo test --workspace --all-features
          fi
        shell: bash

  # ============ 代码覆盖率（仅 Linux，上传 Codecov） ============
  coverage:
    name: Coverage (cargo llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a cargo llvm-cov \
            --workspace \
            --all-features \
            --lcov \
            --output-path lcov.info \
            --show-missing-lines
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust
