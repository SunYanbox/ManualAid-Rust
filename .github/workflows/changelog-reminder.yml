name: Changelog Reminder

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  check-and-remind:
    runs-on: ubuntu-latest
    # 确保即使后续步骤失败，也不阻断 CI
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 步骤：检测相关目录/文件是否有变更
      - name: Check for relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - '.github/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      # 步骤：仅在相关文件有变更时，检查 CHANGELOG 是否被修改
      - name: Check CHANGELOG update
        id: changelog_check
        if: steps.filter.outputs.relevant == 'true'  # filter 输出为 'true' 表示有变更
        run: |
          # 检查是否存在 CHANGELOG*.md 文件的变更
          # 匹配模式：CHANGELOG_ZH_CN.md、CHANGELOG_EN.md 等，支持多语言
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E 'CHANGELOG_.*\.md'; then
            echo "changelog_exists=true" >> $GITHUB_OUTPUT
          else
            echo "changelog_exists=false" >> $GITHUB_OUTPUT
          fi

      # 步骤3：如果 CHANGELOG 未更新，创建或更新评论（Sticky Comment）
      - name: Create or update CHANGELOG reminder
        if: steps.changelog_check.outputs.changelog_exists == 'false'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: changelog-reminder  # 唯一标识符，用于更新同一评论
          message: |
            👋 Thank you for your PR! Changes have been detected in the `crates/`, `Cargo.toml`, `Cargo.lock`, or `.github/` directories, but no updates to `CHANGELOG*.md` files were found.

            If this PR has an impact on users or developers, please consider updating the CHANGELOG. If not, you may ignore this message.

            ---

            👋 感谢你的 PR！检测到 `crates/`、`Cargo.toml`、`Cargo.lock` 或 `.github/` 目录有变更，但未发现 `CHANGELOG*.md` 文件的更新。

            如果此 PR 对用户或开发者有影响，请考虑更新 CHANGELOG。如果不需要，可以忽略此消息。
